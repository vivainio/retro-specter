# Builds release binaries (Linux, macOS arm64 and Intel, Windows) and attaches them,
# unpacked, to a GitHub release.
# Nothing runs on push or pull request; create a release to trigger it:
#   gh release create v0.1.0 --generate-notes
name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The tests need a native binary, so only run them where the target is the host's.
      # Cargo.toml carries 0.0.0-dev; the release version comes from the tag.
      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}" perl -pi -e 's/^version = ".*"/version = "$ENV{VERSION}"/ and $done++ unless $done' Cargo.toml
          grep -m1 '^version' Cargo.toml

      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Published as-is, one asset per target, named so that a stable URL like
      # releases/latest/download/retro-specter-aarch64-apple-darwin always works.
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="retro-specter-${{ matrix.target }}${{ matrix.exe }}"
          cp "target/${{ matrix.target }}/release/retro-specter${{ matrix.exe }}" "$asset"
          gh release upload "${{ github.event.release.tag_name }}" "$asset" --clobber
